<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GS Baseball</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07101e;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{max-width:900px;margin:auto}
header{height:44px;background:#081b35;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:900}.blue{color:#71bdf5}.tiny{font-size:10px;color:#a7bad0}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:6px 10px;background:#10294c}.score{font-size:25px;font-weight:900}.sub{font-size:10px;color:#aec0d3}
#stage{position:relative;aspect-ratio:1/1;background:#2d8148;touch-action:none;overflow:hidden}canvas{width:100%;height:100%;display:block}
#msg{min-height:40px;padding:9px;text-align:center;background:#091b35;font-weight:800;font-size:13px}
#controls{padding:7px;background:#071a34;display:flex;gap:6px;flex-wrap:wrap}button{min-height:45px;flex:1;border:1px solid #3d6896;border-radius:10px;background:#12345f;color:#fff;font-weight:800;font-size:12px}button:active{background:#227fbe}
#stick{display:none;position:absolute;left:14px;bottom:15px;width:126px;height:126px;border-radius:50%;background:#07152da8;border:2px solid #ffffff55}#knob{position:absolute;width:48px;height:48px;left:37px;top:37px;border-radius:50%;background:#75c3f0dd;border:2px solid white}
#action{display:none;position:absolute;right:12px;bottom:15px;width:175px;grid-template-columns:1fr 1fr;gap:7px}#action button{background:#0b3268dd;padding:4px}
#aim{display:none;position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);width:105px;height:125px;border:2px solid #fff;grid-template:repeat(3,1fr)/repeat(3,1fr)}#aim button{min-height:0;border-radius:0;padding:0;background:#ffffff10;border:1px solid #ffffff33}
.badge{position:absolute;left:8px;top:8px;background:#06142cc9;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:800}
</style></head><body>
<header><span>GS BASEBALL <span class="blue">GAME</span></span><span class="tiny">REAL-TIME v2</span></header>
<div id="hud"><div><b>GS</b><div class="sub" id="who"></div></div><div><div class="score"><span id="gs">0</span> - <span id="op">0</span></div><div class="sub"><span id="half">TOP</span> <span id="inn">1</span> · <span id="outs">0</span> OUT · <span id="count">0-0</span></div></div><div><b>RIVALS</b><div class="sub" id="baseHud">◇ ◇ ◇</div></div></div>
<div id="stage"><canvas id="c" width="720" height="720"></canvas><div class="badge" id="state">READY</div><div id="aim"></div><div id="stick"><div id="knob"></div></div><div id="action"><button id="a1">SWING</button><button id="a2">POWER</button><button id="a3">BUNT</button><button id="a4">TAKE</button></div></div>
<div id="msg">Tap PLAY GAME.</div><div id="controls"><button id="play">PLAY GAME</button></div>
<script>
const R=[["1", "MJ Eubanks", "2B"], ["2", "Mason Meharg", "C"], ["3", "Liam Harris", "LF"], ["4", "Cas Hortman", "LC"], ["5", "Landon Wilson", "RF"], ["6", "ColtonLee Crosby", "1B"], ["7", "Wyatt Kell", "SS"], ["13", "Cash Pitts", "3B"], ["14", "Wes Renfroe", "RF"], ["18", "Maverick Roland", "RC"], ["27", "Kade Wilson", "OF"], ["31", "SJ Fairchild", "P"]].map(a=>({num:a[0],name:a[1],pos:a[2]})),$=q=>document.querySelector(q),cv=$('#c'),x=cv.getContext('2d');x.imageSmoothingEnabled=true;
const BASE=[[360,622],[579,389],[360,157],[141,389],[360,622]];
const POS={P:[360,393],C:[360,635],'1B':[535,407],'2B':[449,316],SS:[271,316],'3B':[185,407],LF:[165,205],LC:[285,145],RC:[435,145],RF:[555,205],OF:[360,120]};
let G,fielders=[],runners=[],ball=null,control=null,joy={x:0,y:0},drag=false,paused=false,last=0,raf,timers=[];
const later=(fn,ms)=>{let id=setTimeout(fn,ms);timers.push(id);return id};function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function reset(){clearTimers();G={inning:1,half:0,outs:0,balls:0,strikes:0,gs:0,op:0,batter:0,playing:true};runners=[];ball=null;control=null;setup(false);$('#play').style.display='none';offenseReady();ui()}
function setup(gs){let arr=gs?R.slice(0,9):R.slice(0,9).map((p,i)=>({...p,num:String(i+1)}));fielders=arr.map((p,i)=>{let q=POS[p.pos]||Object.values(POS)[i];return{p,x:q[0],y:q[1],hx:q[0],hy:q[1],gs,has:false,run:0}})}
function turf(){let grad=x.createLinearGradient(0,0,0,720);grad.addColorStop(0,'#257943');grad.addColorStop(1,'#31894d');x.fillStyle=grad;x.fillRect(0,0,720,720);for(let i=0;i<8;i++){x.fillStyle=i%2?'#ffffff08':'#00000006';x.fillRect(0,i*90,720,90)}
x.fillStyle='#b98252';x.beginPath();x.moveTo(360,676);x.lineTo(54,389);x.lineTo(360,83);x.lineTo(666,389);x.closePath();x.fill();x.fillStyle='#e0bb87';x.beginPath();x.moveTo(360,622);x.lineTo(132,389);x.lineTo(360,161);x.lineTo(588,389);x.closePath();x.fill();x.fillStyle='#2b8148';x.beginPath();x.arc(360,390,185,0,Math.PI*2);x.fill();x.strokeStyle='#ffffff99';x.lineWidth=3;x.beginPath();x.moveTo(360,676);x.lineTo(24,322);x.moveTo(360,676);x.lineTo(696,322);x.stroke();BASE.slice(0,4).forEach((q,i)=>{x.save();x.translate(q[0],q[1]);x.rotate(Math.PI/4);x.fillStyle='#fff';x.fillRect(-9,-9,18,18);x.restore()});x.fillStyle='#c99965';x.beginPath();x.arc(360,393,34,0,Math.PI*2);x.fill()}
function human(p,label,team,selected=false,slide=false){x.save();x.translate(p.x,p.y);if(slide)x.rotate(-.72);let moving=p.run||0,leg=Math.sin(moving*10)*7;
x.strokeStyle='#17202b';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-4,2);x.lineTo(-8+leg,18);x.moveTo(4,2);x.lineTo(8-leg,18);x.stroke();
x.strokeStyle=team?'#d7eaf8':'#eee';x.lineWidth=9;x.beginPath();x.moveTo(0,-19);x.lineTo(0,3);x.stroke();
x.strokeStyle=team?'#0b2b53':'#7e2536';x.lineWidth=5;x.beginPath();x.moveTo(0,-13);x.lineTo(-12,-3-leg/3);x.moveTo(0,-13);x.lineTo(12,-3+leg/3);x.stroke();
x.fillStyle='#d7a47b';x.beginPath();x.arc(0,-31,8,0,7);x.fill();x.fillStyle=team?'#70bdf5':'#7e2536';x.beginPath();x.arc(0,-34,9,Math.PI,0);x.fill();x.fillRect(-10,-35,20,4);
x.fillStyle=team?'#071b3b':'#7e2536';x.font='bold 9px system-ui';x.textAlign='center';x.fillText(label,0,-10);if(selected){x.strokeStyle='#ffd95c';x.lineWidth=3;x.beginPath();x.arc(0,-10,26,0,7);x.stroke()}x.restore()}
function draw(){turf();fielders.forEach(f=>human(f,f.p.num,f.gs,f===control));if(G&&G.half===0&&G.playing&&['pitch','ready'].includes(G.phase))human({x:360,y:638,run:0},R[G.batter%R.length].num,true);runners.forEach(r=>human(r,r.num,true,r===control,r.slide));if(ball){let sy=ball.y-(ball.z||0);x.shadowColor='#0008';x.shadowBlur=4;x.fillStyle='#fff';x.beginPath();x.arc(ball.x,sy,5,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#c33';x.lineWidth=1;x.beginPath();x.arc(ball.x,sy,3,0,Math.PI);x.stroke()}}
function loop(t){let dt=Math.min(.03,(t-last)/1000||.016);last=t;if(G&&G.playing&&!paused)update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){moveControl(dt);physics(dt);runnerAI(dt);fielderAI(dt);collisions()}
function moveControl(dt){if(!control||G.half!==1)return;let dx=joy.x,dy=joy.y,m=Math.hypot(dx,dy);if(m>.1){control.x+=dx/m*220*dt;control.y+=dy/m*220*dt;control.run=(control.run||0)+dt;clamp(control)}}
function clamp(p){p.x=Math.max(25,Math.min(695,p.x));p.y=Math.max(70,Math.min(675,p.y))}
function physics(dt){if(!ball)return;if(ball.kind==='pitch'){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y>=630)called()}else if(ball.kind==='batted'){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;ball.vz-=500*dt;if(ball.z<=0){ball.z=0;if(ball.vz<0){ball.vz*=-.22;ball.vx*=.84;ball.vy*=.84}}if(ball.x<10||ball.x>710||ball.y<40||ball.y>705){ball.vx*=.5;ball.vy*=.5}}else if(ball.kind==='throw'){let dx=ball.tx-ball.x,dy=ball.ty-ball.y,d=Math.hypot(dx,dy);if(d<12){ball.x=ball.tx;ball.y=ball.ty;ball.kind='held';ball.holder=ball.recv;ball.recv.has=true}else{ball.x+=dx/d*650*dt;ball.y+=dy/d*650*dt}}}
function runnerAI(dt){runners.forEach(r=>{if(!r.path.length)return;let q=r.path[0],dx=q[0]-r.x,dy=q[1]-r.y,d=Math.hypot(dx,dy),sp=r.slide?230:185;if(d<7){r.x=q[0];r.y=q[1];r.path.shift();if(!r.path.length){r.base=r.dest;r.slide=false;if(r.base===4){r.scored=true;G.gs++;say('RUN SCORES!')}}}else{r.x+=dx/d*sp*dt;r.y+=dy/d*sp*dt;r.run+=dt}});runners=runners.filter(r=>!r.scored)}
function fielderAI(dt){if(!ball||ball.kind!=='batted')return;let near=fielders.reduce((a,b)=>dist(b,ball)<dist(a,ball)?b:a);fielders.forEach(f=>{if(f===control)return;let tx=f===near?ball.x:f.hx,ty=f===near?ball.y:f.hy,dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);if(d>5){f.x+=dx/d*(f===near?175:100)*dt;f.y+=dy/d*(f===near?175:100)*dt;f.run+=dt}});if(G.half===1&&!control){control=near;showStick(true)}}
function collisions(){if(ball&&ball.kind==='batted'&&ball.z<18){for(let f of fielders){if(dist(f,ball)<21){ball.kind='held';ball.holder=f;f.has=true;if(G.half===0)cpuDefense(f);else{control=f;fieldControls()}return}}}
if(ball&&ball.kind==='held'&&ball.holder){for(let r of [...runners])if(r.path.length&&dist(ball.holder,r)<21){runners.splice(runners.indexOf(r),1);say('TAGGED OUT!');out();return}}}
function offenseReady(){G.phase='ready';showStick(false);showAction(false);$('#controls').innerHTML='';later(pitch,650);say(`#${R[G.batter%R.length].num} ${R[G.batter%R.length].name} steps in.`)}
function pitch(){if(G.half!==0)return;G.phase='pitch';ball={x:360,y:395,z:0,kind:'pitch',vx:(Math.random()-.5)*28,vy:295};showAction(true);$('#a1').textContent='SWING';$('#a2').textContent='POWER';$('#a3').textContent='BUNT';$('#a4').textContent='TAKE';$('#a1').onclick=()=>swing(false);$('#a2').onclick=()=>swing(true);$('#a3').onclick=bunt;$('#a4').onclick=()=>{};say('Pitch coming!')}
function swing(power){if(!ball||ball.kind!=='pitch')return;let d=Math.abs(ball.y-603);if(d>72){strike('Swing and miss!');return}let q=1-d/72,sp=(power?390:325)+q*(power?255:205),ang=-2.82+Math.random()*2.5;ball={x:360,y:600,z:7,kind:'batted',vx:Math.cos(ang)*sp,vy:-Math.abs(Math.sin(ang)*sp),vz:100+q*(power?355:275)};contactRun();say(q>.76?'BARRELED!':'BALL IN PLAY!')}
function bunt(){if(!ball||ball.kind!=='pitch')return;ball={x:360,y:600,z:3,kind:'batted',vx:(Math.random()-.5)*115,vy:-150,vz:35};contactRun();say('BUNT!')}
function contactRun(){showAction(false);let p=R[G.batter%R.length];runners.push({num:p.num,x:360,y:622,base:0,dest:1,path:[BASE[1]],run:0,slide:false});G.batter=(G.batter+1)%R.length;G.balls=G.strikes=0;existingAdvance();G.phase='live';ui()}
function existingAdvance(){for(let i=0;i<runners.length-1;i++){let r=runners[i],to=Math.min(4,r.base+1);r.dest=to;r.path=route(r.base,to)}}
function route(a,b){let z=[];for(let i=a+1;i<=b;i++)z.push(BASE[Math.min(i,4)]);return z}
function called(){let strikeZone=Math.abs(ball.x-360)<43;ball=null;if(strikeZone)strike('Called strike.');else{G.balls++;say('Ball.');if(G.balls>=4)walk();else later(pitch,600)}ui()}
function strike(m){ball=null;G.strikes++;say(m);if(G.strikes>=3)out();else later(pitch,600);ui()}
function walk(){let p=R[G.batter%R.length];runners.push({num:p.num,x:360,y:622,base:0,dest:1,path:[BASE[1]],run:0});G.batter=(G.batter+1)%R.length;G.balls=G.strikes=0;say('BALL FOUR.');later(offenseReady,500);ui()}
function cpuDefense(f){let moving=runners.filter(r=>r.path.length);if(!moving.length){endLive();return}let target=moving.sort((a,b)=>b.dest-a.dest)[0],base=Math.min(3,target.dest),q=BASE[base],recv=nearest(q);later(()=>throwBall(f,recv,q),180);later(()=>{if(runners.includes(target)&&dist(target,q)>20){runners.splice(runners.indexOf(target),1);say('OUT!');out()}else{say('SAFE!');endLive()}},650)}
function nearest(q){return fielders.reduce((a,b)=>dist(b,q)<dist(a,q)?b:a)}
function throwBall(from,to,q){from.has=false;ball={x:from.x,y:from.y,z:8,kind:'throw',tx:q[0],ty:q[1],recv:to}}
function endLive(){ball=null;runners.forEach(r=>r.path=[]);later(offenseReady,700);ui()}
function defensePitch(){G.phase='defensePitch';showStick(false);showAction(false);control=null;$('#aim').style.display='grid';if(!$('#aim').children.length)for(let i=0;i<9;i++){let b=document.createElement('button');b.onclick=()=>{document.querySelectorAll('#aim button').forEach(z=>z.style.background='');b.style.background='#70bdf588';G.aim=i};$('#aim').appendChild(b)}
$('#controls').innerHTML='<button id="fast">FASTBALL</button><button id="change">CHANGEUP</button><button id="curve">CURVE</button><button id="deliver">PITCH</button>';let pc='fast';['fast','change','curve'].forEach(id=>$('#'+id).onclick=()=>pc=id);$('#deliver').onclick=()=>cpuAtBat(pc);say('Choose pitch and location.')}
function cpuAtBat(pc){$('#aim').style.display='none';$('#controls').innerHTML='';say('Pitch...');later(()=>{let r=Math.random();if(r<.3){G.strikes++;say('STRIKE!');if(G.strikes>=3)out();else later(defensePitch,500)}else if(r<.42){G.balls++;say('Ball.');if(G.balls>=4){G.balls=G.strikes=0;G.op++;say('Walk eventually scores in this build.');later(defensePitch,600)}else later(defensePitch,500)}else{let ang=-2.85+Math.random()*2.55,sp=260+Math.random()*330;ball={x:360,y:600,z:5,kind:'batted',vx:Math.cos(ang)*sp,vy:-Math.abs(Math.sin(ang)*sp),vz:100+Math.random()*290};G.phase='live';say('BALL IN PLAY — FIELD IT!');showStick(true)}ui()},400)}
function fieldControls(){showAction(true);$('#a1').textContent='1B';$('#a2').textContent='2B';$('#a3').textContent='3B';$('#a4').textContent='HOME';$('#a1').onclick=()=>manualThrow(1);$('#a2').onclick=()=>manualThrow(2);$('#a3').onclick=()=>manualThrow(3);$('#a4').onclick=()=>manualThrow(0);say('FIELD IT — MAKE THE THROW!')}
function manualThrow(b){if(!ball||ball.kind!=='held')return;let q=BASE[b],recv=nearest(q);throwBall(ball.holder,recv,q);showAction(false);later(()=>{say(Math.random()<.68?'OUT!':'SAFE!');if(Math.random()<.68)out();else defensePitch()},650)}
function out(){G.outs++;G.balls=G.strikes=0;ball=null;showAction(false);showStick(false);if(G.outs>=3)side();else later(G.half===0?offenseReady:defensePitch,650);ui()}
function side(){G.outs=0;G.balls=G.strikes=0;runners=[];ball=null;control=null;if(G.half===0){G.half=1;setup(true);say('THREE OUTS — GS TAKES THE FIELD.');later(defensePitch,800)}else{G.half=0;G.inning++;setup(false);say('SIDE RETIRED — GS TO BAT.');later(offenseReady,800)}ui()}
function showStick(v){$('#stick').style.display=v?'block':'none'}function showAction(v){$('#action').style.display=v?'grid':'none'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function say(t){$('#msg').textContent=t;$('#state').textContent=(G?.phase||'ready').toUpperCase()}
function ui(){if(!G)return;$('#gs').textContent=G.gs;$('#op').textContent=G.op;$('#inn').textContent=G.inning;$('#half').textContent=G.half?'BOT':'TOP';$('#outs').textContent=G.outs;$('#count').textContent=`${G.balls}-${G.strikes}`;$('#who').textContent=G.half?'DEFENSE':`#${R[G.batter%R.length].num} ${R[G.batter%R.length].name}`;let b=[0,0,0];runners.forEach(r=>{if(r.base>0&&r.base<4&&!r.path.length)b[r.base-1]=1});$('#baseHud').textContent=b.reverse().map(v=>v?'◆':'◇').join(' ')}
$('#play').onclick=reset;const st=$('#stick'),kn=$('#knob');st.addEventListener('pointerdown',e=>{drag=true;j(e)});addEventListener('pointermove',e=>drag&&j(e));addEventListener('pointerup',()=>{drag=false;joy={x:0,y:0};kn.style.transform=''});function j(e){let r=st.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),lim=38;if(m>lim){dx*=lim/m;dy*=lim/m}joy={x:dx/lim,y:dy/lim};kn.style.transform=`translate(${dx}px,${dy}px)`}
G={inning:1,half:0,outs:0,balls:0,strikes:0,gs:0,op:0,batter:0,playing:false,phase:'ready'};setup(false);ui();raf=requestAnimationFrame(loop);
</script></body></html>

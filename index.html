<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>GS Baseball — Pixel Diamond</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#061329;color:white;font-family:ui-monospace,Menlo,monospace;overscroll-behavior:none}body{max-width:920px;margin:auto}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#081d40;border-bottom:2px solid #27558d;font-weight:900}.blue{color:#73bdf6}.tiny{font-size:11px;color:#9eb3ce}
#hud{display:grid;grid-template-columns:1fr auto 1fr;background:#0c234b;padding:7px 10px;align-items:center;text-align:center}.score{font-size:25px;font-weight:900}.sub{font-size:11px;color:#adc0d8}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:#277b43;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#message{min-height:42px;padding:9px;text-align:center;background:#071a38;font-weight:800}
#controls{padding:8px;background:#081d40}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button,select{min-height:45px;border:1px solid #356498;border-radius:9px;background:#123260;color:#fff;font:inherit;font-weight:800}button:active,.on{background:#1b7bc0}.wide{grid-column:span 4}
#stick{position:absolute;left:14px;bottom:14px;width:128px;height:128px;border-radius:50%;background:#07152e99;border:2px solid #ffffff44;display:none}#knob{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#75bdf4cc;border:2px solid white}
#actionPad{position:absolute;right:14px;bottom:18px;display:none;gap:9px;flex-direction:column}#actionPad button{width:76px;height:55px;background:#0b3267dd}
#actionPad .throw{background:#175c96dd}.menu{padding:8px;display:flex;gap:6px;flex-wrap:wrap;background:#061329}.menu select{flex:1;min-width:180px}
@media(min-width:700px){#stage{border-left:2px solid #244d7e;border-right:2px solid #244d7e}}
</style></head><body>
<header><div>GS BASEBALL <span class="blue">PIXEL DIAMOND</span></div><span class="tiny">ARCADE</span></header>
<div class="menu"><select id="player"></select><select id="mode"><option value="game">FULL GAME</option><option value="hr">HOME RUN DERBY</option><option value="field">FIELDING LAB</option></select><button id="restart">RESTART</button></div>
<section id="hud"><div><b>GS BASEBALL</b><div class="sub" id="who"></div></div><div><div class="score"><span id="gs">0</span> - <span id="opp">0</span></div><div class="sub"><span id="half">TOP</span> <span id="inning">1</span> · <span id="outs">0</span> OUT</div></div><div><b>RIVALS</b><div class="sub" id="count">0-0</div></div></section>
<div id="stage"><canvas id="c" width="720" height="720"></canvas><div id="stick"><div id="knob"></div></div><div id="actionPad"><button id="aBtn">SWING</button><button id="bBtn" class="throw">THROW</button></div></div>
<div id="message">Tap PLAY BALL to start.</div>
<div id="controls"><div class="grid" id="buttons"><button class="wide" id="play">PLAY BALL</button></div></div>
<script>
const R=[{"num": "1", "name": "MJ Eubanks", "pos": "2B"}, {"num": "2", "name": "Mason Meharg", "pos": "C"}, {"num": "3", "name": "Liam Harris", "pos": "LF"}, {"num": "4", "name": "Cas Hortman", "pos": "LC"}, {"num": "5", "name": "Landon Wilson", "pos": "RF"}, {"num": "6", "name": "ColtonLee Crosby", "pos": "1B"}, {"num": "7", "name": "Wyatt Kell", "pos": "SS"}, {"num": "13", "name": "Cash Pitts", "pos": "3B"}, {"num": "14", "name": "Wes Renfroe", "pos": "RF"}, {"num": "18", "name": "Maverick Roland", "pos": "RC"}, {"num": "27", "name": "Kade Wilson", "pos": "OF"}, {"num": "31", "name": "SJ Fairchild", "pos": "P"}],cv=document.querySelector('#c'),x=cv.getContext('2d'),$=q=>document.querySelector(q);x.imageSmoothingEnabled=false;
R.forEach((p,i)=>$('#player').add(new Option(`#${p.num} ${p.name} · ${p.pos}`,i)));
let S={},raf=0,last=0,keys={},joy={x:0,y:0},drag=false,controlled=null,ball=null,phase='ready',pitchT=0,contact=null;
const pos={P:[360,385],C:[360,620],'1B':[545,430],'2B':[445,330],SS:[275,330],'3B':[175,430],LF:[170,190],LC:[280,135],RC:[440,135],RF:[550,190],OF:[360,120]};
function reset(){S={inning:1,half:0,outs:0,balls:0,strikes:0,gs:0,opp:0,bases:[0,0,0],batter:+$('#player').value,fielders:[],runners:[],derby:0};phase='ready';ball=null;buildFielders();ui();say('Tap PLAY BALL to start.');buttonsReady()}
function buildFielders(){S.fielders=R.slice(0,9).map((p,i)=>{let q=pos[p.pos]||[[360,385],[545,430],[445,330],[275,330],[175,430],[170,190],[280,135],[440,135],[550,190]][i];return {p,x:q[0],y:q[1],tx:q[0],ty:q[1]}})}
function field(){x.fillStyle='#287e45';x.fillRect(0,0,720,720);x.fillStyle='#c68a54';x.beginPath();x.moveTo(360,650);x.lineTo(90,380);x.lineTo(360,110);x.lineTo(630,380);x.closePath();x.fill();x.fillStyle='#e7c28f';x.beginPath();x.moveTo(360,610);x.lineTo(135,380);x.lineTo(360,155);x.lineTo(585,380);x.closePath();x.fill();x.fillStyle='#287e45';x.beginPath();x.arc(360,380,175,0,7);x.fill();x.strokeStyle='#fff8';x.lineWidth=3;x.beginPath();x.moveTo(360,660);x.lineTo(35,325);x.moveTo(360,660);x.lineTo(685,325);x.stroke();[[360,610],[145,380],[360,165],[575,380]].forEach(q=>{x.fillStyle='white';x.fillRect(q[0]-9,q[1]-9,18,18)})}
function sprite(px,py,label,team=true){x.fillStyle=team?'#071b3b':'#8b2635';x.fillRect(px-10,py-18,20,25);x.fillStyle=team?'#71bdf5':'#eee';x.fillRect(px-9,py-30,18,12);x.fillStyle='#fff';x.font='bold 12px monospace';x.textAlign='center';x.fillText(label,px,py-37)}
function draw(){field();if(S.half===1||$('#mode').value==='field'){S.fielders.forEach(f=>sprite(f.x,f.y,'#'+f.p.num,true));if(controlled){x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(controlled.x-15,controlled.y-35,30,45)}}else{sprite(360,625,'#'+R[S.batter%R.length].num,true);sprite(360,390,'P',false)}
if(ball){x.fillStyle='white';x.fillRect(ball.x-5,ball.y-5,10,10)}S.runners.forEach(r=>sprite(r.x,r.y,'R',true))}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){if(controlled){let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+joy.x,dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)+joy.y;let m=Math.hypot(dx,dy);if(m>.1){controlled.x+=dx/m*190*dt;controlled.y+=dy/m*190*dt;controlled.x=Math.max(45,Math.min(675,controlled.x));controlled.y=Math.max(80,Math.min(650,controlled.y))}}
if(phase==='pitch'&&ball){pitchT+=dt;ball.y+=260*dt;if(ball.y>=610){calledStrike()}}
if(phase==='hit'&&ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=120*dt;if(ball.y>690||ball.x<15||ball.x>705)resolveHit();if(S.half===1)chooseFielder()}
if(phase==='field'&&ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.985;ball.vy*=.985;if(controlled&&Math.hypot(controlled.x-ball.x,controlled.y-ball.y)<24){phase='throw';ball.vx=ball.vy=0;ball.x=controlled.x;ball.y=controlled.y-10;say('FIELD IT! Choose a base to throw to.');throwButtons()}}}
function startAB(){if($('#mode').value==='field'){fieldDrill();return}phase='pitch';pitchT=0;ball={x:360,y:390};say(`#${R[S.batter%R.length].num} ${R[S.batter%R.length].name} — pitch coming!`);$('#aBtn').textContent='SWING';showPads(false,true)}
function swing(){if(phase!=='pitch'||!ball)return;let d=Math.abs(ball.y-600);if(d<60){let quality=1-d/60,ang=(-1.2+Math.random()*.95),spd=220+quality*300;ball={x:360,y:590,vx:Math.cos(ang)*spd*(Math.random()<.5?-1:1),vy:-Math.abs(Math.sin(ang)*spd)};phase='hit';contact=quality;say(quality>.78?'BARRELED!':quality>.45?'Ball in play!':'Weak contact...')}else{S.strikes++;say('Swing and miss!');phase='ready';if(S.strikes>=3)makeOut();else setTimeout(startAB,500);ui()}}
function calledStrike(){ball=null;phase='ready';S.strikes++;say('Called strike.');if(S.strikes>=3)makeOut();else setTimeout(startAB,500);ui()}
function resolveHit(){if(!ball)return;let q=contact||.3,hr=q>.83&&ball.y<250;ball=null;phase='ready';if($('#mode').value==='hr'){S.derby+=hr?1:0;say(hr?`💥 HOME RUN! Derby total: ${S.derby}`:'Not enough — try again!');setTimeout(startAB,700);return}
let bases=hr?4:q>.62?2:1;scoreHit(bases);setTimeout(startAB,700)}
function scoreHit(n){let runs=0;if(n===4){runs=1+S.bases.filter(Boolean).length;S.bases=[0,0,0]}else{for(let k=0;k<n;k++){if(S.bases[2])runs++;S.bases[2]=S.bases[1];S.bases[1]=S.bases[0];S.bases[0]=0}S.bases[n-1]=1}S.gs+=runs;S.batter=(S.batter+1)%R.length;S.balls=S.strikes=0;say(n===4?`HOME RUN! ${runs} run${runs===1?'':'s'} score!`:n===2?'DOUBLE!':'BASE HIT!');ui()}
function makeOut(){S.outs++;S.balls=S.strikes=0;S.batter=(S.batter+1)%R.length;if(S.outs>=3){S.half=1;S.outs=0;S.bases=[0,0,0];say('SIDE RETIRED — take the field!');setTimeout(defense,800)}else setTimeout(startAB,600);ui()}
function defense(){S.half=1;phase='defense';showPads(false,false);$('#buttons').innerHTML='<button id="fast">FASTBALL</button><button id="change">CHANGE</button><button id="curve">CURVE</button><button class="wide" id="pitchBtn">PITCH</button>';let pt='fast';['fast','change','curve'].forEach(id=>$('#'+id).onclick=()=>pt=id);$('#pitchBtn').onclick=()=>oppPitch(pt);ui()}
function oppPitch(pt){phase='oppPitch';say('Pitch delivered...');setTimeout(()=>{let r=Math.random();if(r<.32){say('Strike!');S.strikes++;if(S.strikes>=3)defOut();else defense()}else if(r<.48){S.balls++;say('Ball.');if(S.balls>=4)oppReach();else defense()}else{let a=Math.random()*Math.PI+.05,sp=180+Math.random()*180;ball={x:360,y:390,vx:Math.cos(a)*sp,vy:-Math.abs(Math.sin(a)*sp)};phase='field';controlled=null;say('BALL IN PLAY — move to it!');showPads(true,true)}ui()},450)}
function chooseFielder(){if(controlled||!ball)return;controlled=S.fielders.reduce((a,b)=>Math.hypot(b.x-ball.x,b.y-ball.y)<Math.hypot(a.x-ball.x,a.y-ball.y)?b:a);showPads(true,true)}
function throwButtons(){showPads(true,true);$('#aBtn').textContent='1B';$('#bBtn').textContent='2B';$('#aBtn').onclick=()=>throwTo(1);$('#bBtn').onclick=()=>throwTo(2);$('#buttons').innerHTML='<button id="third">THROW 3B</button><button id="home">THROW HOME</button>';$('#third').onclick=()=>throwTo(3);$('#home').onclick=()=>throwTo(0)}
function throwTo(base){if(phase!=='throw')return;phase='defense';ball=null;controlled=null;let correct=base===1||Math.random()>.65;if(correct){say('OUT! Great decision.');defOut()}else{say('SAFE! Wrong base — runner advances.');oppReach()}}
function defOut(){S.outs++;S.balls=S.strikes=0;if(S.outs>=3){S.inning++;S.half=0;S.outs=0;S.bases=[0,0,0];controlled=null;say(`Inning ${S.inning} — GS back to bat!`);buttonsReady()}else defense();ui()}
function oppReach(){S.opp++;S.balls=S.strikes=0;say('Runner scores. Reset and get the next hitter.');defense();ui()}
function fieldDrill(){S.half=1;phase='field';let a=Math.random()*Math.PI+.05;ball={x:360,y:390,vx:Math.cos(a)*(180+Math.random()*180),vy:-Math.abs(Math.sin(a)*(180+Math.random()*180))};controlled=null;say('FIELDING LAB — chase it down!');showPads(true,true)}
function showPads(stick,acts){$('#stick').style.display=stick?'block':'none';$('#actionPad').style.display=acts?'flex':'none';if(acts){$('#aBtn').onclick=swing;$('#bBtn').onclick=()=>{};$('#aBtn').textContent='SWING';$('#bBtn').textContent='THROW'}}
function buttonsReady(){$('#buttons').innerHTML='<button class="wide" id="play">PLAY BALL</button>';$('#play').onclick=startAB;showPads(false,false);ui()}
function say(s){$('#message').textContent=s}
function ui(){$('#gs').textContent=S.gs;$('#opp').textContent=S.opp;$('#inning').textContent=S.inning;$('#half').textContent=S.half?'BOT':'TOP';$('#outs').textContent=S.outs;$('#count').textContent=`${S.balls}-${S.strikes}`;$('#who').textContent=`#${R[S.batter%R.length].num} ${R[S.batter%R.length].name}`}
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
const stick=$('#stick'),knob=$('#knob');function jp(e){drag=true;jm(e)}function jm(e){if(!drag)return;let r=stick.getBoundingClientRect(),px=e.clientX-(r.left+r.width/2),py=e.clientY-(r.top+r.height/2),m=Math.hypot(px,py),lim=38;if(m>lim){px*=lim/m;py*=lim/m}joy={x:px/lim,y:py/lim};knob.style.transform=`translate(${px}px,${py}px)`}function ju(){drag=false;joy={x:0,y:0};knob.style.transform=''}
stick.addEventListener('pointerdown',jp);addEventListener('pointermove',jm);addEventListener('pointerup',ju);
$('#restart').onclick=reset;$('#player').onchange=()=>{S.batter=+$('#player').value;ui()};$('#mode').onchange=reset;reset();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
</script></body></html>
